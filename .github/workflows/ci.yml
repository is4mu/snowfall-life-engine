name: Public repository checks

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  publication-boundary:
    name: Publication boundary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate public shell and manifests
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          root = Path(".")

          required = [
              "README.md",
              "LICENSE",
              "CONTRIBUTING.md",
              "SECURITY.md",
              "docs/EXPORT_BOUNDARY.md",
              "docs/TESTING.md",
              "docs/TEST_MIGRATION_MATRIX.md",
              "docs/TEST_LAYOUT_PLAN.md",
              "docs/FIXTURES.md",
              "docs/CI_TIERS.md",
              "oss/export-manifest.json",
              "oss/exclusion-manifest.json",
              "oss/test-migration-manifest.json",
              "oss/fixture-migration-manifest.json",
              ".github/workflows/ci.yml",
          ]
          missing = [path for path in required if not (root / path).is_file()]
          if missing:
              raise SystemExit(f"missing required public-shell files: {missing}")

          export = json.loads((root / "oss/export-manifest.json").read_text())
          exclusion = json.loads((root / "oss/exclusion-manifest.json").read_text())
          migration = json.loads(
              (root / "oss/test-migration-manifest.json").read_text()
          )
          fixtures = json.loads(
              (root / "oss/fixture-migration-manifest.json").read_text()
          )

          if export.get("status") not in {
              "phase-0-pre-export",
              "engine-exported",
          }:
              raise SystemExit(f"unexpected export status: {export.get('status')!r}")

          if migration.get("source_file_count") != 146:
              raise SystemExit("test migration manifest must cover exactly 146 source files")
          if migration.get("executable_test_file_count") != 138:
              raise SystemExit("test migration manifest executable-test count must be 138")
          if migration.get("support_file_count") != 8:
              raise SystemExit("test migration manifest support-file count must be 8")
          if not re.fullmatch(r"[0-9a-f]{40}", migration.get("source_baseline", "")):
              raise SystemExit("test migration source baseline must be a 40-hex SHA")

          entries = migration.get("entries", [])
          if len(entries) != migration["source_file_count"]:
              raise SystemExit(
                  "test migration entry count does not match source_file_count"
              )

          sources = [entry.get("source") for entry in entries]
          if len(set(sources)) != len(sources):
              raise SystemExit("duplicate source path in test migration manifest")
          if any(
              not isinstance(source, str)
              or not source.startswith("tests/life/")
              or not source.endswith(".py")
              for source in sources
          ):
              raise SystemExit("invalid source path in test migration manifest")

          test_count = sum(
              Path(source).name.startswith("test_") for source in sources
          )
          if test_count != migration["executable_test_file_count"]:
              raise SystemExit("test migration test/support classification drifted")

          historical_public_tokens = ("test_slice", "test_issue", "rereview")
          for entry in entries:
              disposition = entry.get("disposition")
              destination = entry.get("destination")
              if not disposition or not destination:
                  raise SystemExit(
                      f"incomplete migration entry: {entry.get('source')}"
                  )
              if any(token in destination for token in historical_public_tokens):
                  raise SystemExit(
                      "historical development naming leaked into destination for "
                      + entry["source"]
                  )

          if fixtures.get("source_file_count") != 4:
              raise SystemExit("fixture migration manifest must cover exactly 4 files")
          fixture_entries = fixtures.get("entries", [])
          if len(fixture_entries) != fixtures["source_file_count"]:
              raise SystemExit("fixture migration entry count mismatch")
          fixture_sources = [entry.get("source") for entry in fixture_entries]
          if len(set(fixture_sources)) != len(fixture_sources):
              raise SystemExit("duplicate fixture source path")
          if any(
              not isinstance(source, str)
              or not source.startswith("tests/fixtures/life/")
              or not source.endswith(".json")
              for source in fixture_sources
          ):
              raise SystemExit("invalid fixture source path")
          for entry in fixture_entries:
              if not entry.get("disposition") or not entry.get("destination"):
                  raise SystemExit(
                      f"incomplete fixture migration entry: {entry.get('source')}"
                  )

          forbidden = []
          for name in exclusion["forbidden_top_level_paths"]:
              if (root / name).exists():
                  forbidden.append(name)

          for path in exclusion["forbidden_exact_paths"]:
              if (root / path).exists():
                  forbidden.append(path)

          for prefix in exclusion["forbidden_prefixes"]:
              target = root / prefix
              if target.exists():
                  forbidden.append(prefix)

          if forbidden:
              raise SystemExit(
                  "forbidden private paths are present in public repository: "
                  + ", ".join(sorted(forbidden))
              )

          workflow_dir = root / ".github" / "workflows"
          forbidden_trigger = "pull_request" + "_target"
          for path in workflow_dir.glob("*.y*ml"):
              text = path.read_text(encoding="utf-8")
              if forbidden_trigger in text:
                  raise SystemExit(
                      f"unsafe public workflow trigger {forbidden_trigger} in {path}"
                  )

          print("public repository boundary checks passed")
          PY
