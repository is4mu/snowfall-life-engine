name: P1 persistence compatibility evidence

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  persistence:
    name: Persistence golden and preflight (hash=${{ matrix.hashseed }}, tz=${{ matrix.tz }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        hashseed: ['0', '1', '8675309']
        tz: ['UTC', 'Asia/Tokyo']
    env:
      PYTHONHASHSEED: ${{ matrix.hashseed }}
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r engine/life/requirements.txt -r tests/requirements.txt
      - name: Check persistence contracts and replay
        run: python -m pytest -q tests/contracts/persistence

  full:
    name: P1 Full and coverage including long-horizon gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r engine/life/requirements.txt -r tests/requirements.txt
      - name: Run Full once with branch coverage
        run: >-
          python -m pytest --cov=engine.life --cov-branch
          --cov-report=term --cov-report=json:coverage.json
      - uses: actions/upload-artifact@v4
        with:
          name: p1-persistence-full-coverage
          path: coverage.json
          if-no-files-found: error
