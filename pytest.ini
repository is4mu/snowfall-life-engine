[pytest]
testpaths = tests
addopts = -ra
markers =
    unit: pure or nearly pure subsystem behavior
    contract: versioned representations and externally meaningful guarantees
    integration: behavior across real subsystem boundaries
    scenario: human-readable deterministic synthetic stories
    calibration: deterministic public-policy behavioral envelope checks
    soak: long-horizon deterministic validation
    publication: repository publication and privacy boundary checks
    slow: cost marker for tests excluded from Fast
